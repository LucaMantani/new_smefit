#   smefit template_runcards/ultranest_fit.yaml
# and then
#   smefit template_runcards/posterior_correlations.yaml

# Previously run fits. `path` is the directory *containing* the fit; drop it to
# look the fit up in smefit_results/fits, downloading it from the server if it
# is not there yet. `label` is passed to matplotlib verbatim.
fits:
  - {name: analytical_fit, path: '.', label: '$\mathrm{Analytic}$'}
  - {name: ultranest_fit, path: '.', label: '$\mathrm{UltraNest}$'}

# `with fits` opens a section per fit, headed by `{@fit@}` — the fit's name, the
# same name its files are given. The heatmap itself is titled with the label
# above. Every cell is annotated, so there is no table to go with it; the raw
# numbers are in each fit's fit_results.json.
template_text: |
    Posterior correlations
    ======================
    {@with fits@}
    {@fit@}
    ---------
    {@plot_posterior_correlations@}
    {@endwith@}

actions_:
