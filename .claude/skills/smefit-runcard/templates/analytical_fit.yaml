# path to data and theory: point these into a clone of
# https://github.com/LHCfitNikhef/smefit_database (<clone>/commondata, <clone>/theory)
data_path: /path/to/smefit_database/commondata  # <-- set to your smefit_database clone (smefit-datasets skill: smefit_db.py locate)
theory_path: /path/to/smefit_database/theory  # <-- set to your smefit_database clone (smefit-datasets skill: smefit_db.py locate)
# Covmat settings
use_theory_covmat: True
use_t0: True

rge:
  init_scale: 10000.0
  obs_scale: dynamic  # float or "dynamic"
  smeft_accuracy: integrate  # options: integrate, leadinglog
  yukawa: top  # options: top, full or none
  adm_QCD: false  # if true, the EW couplings are set to zero

# Datasets to include
datasets:
  - {name: LEP1_EWPOs_2006, order: LO}

# Coefficients to fit
coefficients:
  OpWB:
    free: True
    prior: {dist: uniform, low: -0.5, high: 0.5}
  OpD:
    free: True
    prior: {dist: uniform, low: -0.5, high: 0.5}

actions_:
- run_analytic_fit
