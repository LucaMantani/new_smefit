name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: pip install -e .

      # The database tests (template runcard validation, smefit_db.py) skip
      # without a clone; follow main so database changes that break the
      # templates show up here.
      - name: Clone smefit_database
        run: |
          DB="$GITHUB_WORKSPACE/../smefit_database"
          git clone --depth 1 https://github.com/LHCfitNikhef/smefit_database.git "$DB"
          mkdir -p .config
          cat > .config/paths.yaml <<EOF
          new_smefit: $GITHUB_WORKSPACE
          smefit_database: $(cd "$DB" && pwd)
          smefit_results: $GITHUB_WORKSPACE/../smefit_results
          EOF

      - name: Lint
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with coverage
        run: |
          pip install pytest-cov
          pytest tests/ --cov=smefit --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
