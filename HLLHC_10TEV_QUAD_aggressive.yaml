# HLLHC 10 TeV QUAD aggressive runcard
# Datasets: LHC Run I/II data + HL-LHC projections at 14 TeV
# Expansion: full quadratic EFT (use_quad: True)
# RGE: initial scale 10 TeV
# Coefficient format: natural expressions
#   Each physical coefficient Op is constrained as: Op = bound * Op_nat
#   where Op_nat is a dimensionless natural variable with uniform prior on [-1, 1]

# path to common data
data_path: /path/to/smefit_database/commondata_projections_L0

# path to theory tables
theory_path: /path/to/smefit_database/theory

# Covmat settings
use_theory_covmat: True
use_t0: True

# SMEFT Expansion Order
use_quad: True

rge:
  init_scale: 10000.0
  obs_scale: dynamic  # float or "dynamic"
  smeft_accuracy: integrate  # options: integrate, leadinglog
  yukawa: top  # options: top, full or none
  adm_QCD: false  # if true, the EW couplings are set to zero

