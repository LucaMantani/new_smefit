# path to data and theory
data_path: /Users/Luca/Applications/smefit_database/commondata
theory_path: /Users/Luca/Applications/smefit_database/theory
# Covmat settings
use_theory_covmat: False
use_t0: False
# SMEFT Expansion Order
use_quad: True
# # Datasets to include
datasets:
  - {name: LEP1_EWPOs_2006, order: LO}
  - {name: LEP_Bhabha_2013, order: LO}
# Coefficients to fit
coefficients:
  OtG:
    free: False
    vars: [y, OpWB]
    expr: "y**2 + 0.5*OpWB**2"
  OpWB:
    free: True
    prior: {dist: uniform, low: -0.5, high: 0.5}
  OpD:
    free: False
    value: 1.0
  y:
    free: True
    prior: {dist: uniform, low: -1.0, high: 1.0}

actions_:
- run_test
