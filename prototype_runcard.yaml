# path to data and theory
data_path: ./commondata
theory_path: ./theory
# Covmat settings
use_theory_covmat: True
use_t0: True
# SMEFT Expansion Order
use_quad: False

# Nested Sampling settings
ultranest_settings:
  ReactiveNS_settings:
    vectorized: False
    ndraw_max: 500              # Maximum number of points to simultaneously propose.
  Run_settings:
    min_num_live_points: 200    # Minimum number of live points throughout the run.
    min_ess: 50                 # Target number of effective posterior samples.
    frac_remain: 0.3            # Integrate until this fraction of the integral is left in the remainder.
  # SliceSampler_settings:
  #   nsteps: 106                 # number of accepted steps until the sample is considered independent.

# rge:
#   init_scale: 10000.0
#   obs_scale: dynamic  # float or "dynamic"
#   smeft_accuracy: integrate  # options: integrate, leadinglog
#   yukawa: top  # options: top, full or none
#   adm_QCD: false  # if true, the EW couplings are set to zero
  # rg_matrix: rge_matrix10000.pkl

# # Datasets to include
datasets:
  - {name: LEP1_EWPOs_2006, order: LO}
  - {name: LEP_Bhabha_2013, order: LO}
  - {name: ATLAS_hh_runII_13TeV, order: LO}
# Coefficients to fit
coefficients:
  # OtG:
  #   free: False
  #   vars: [y, OpWB]
  #   expr: "sqrt(y**2 + 0.5*OpWB**2)"
  OpWB:
    free: True
    prior: {dist: uniform, low: -0.5, high: 0.5}
  OpD:
    free: True
    prior: {dist: uniform, low: -0.5, high: 0.5}
  OpBox:
    free: False
    # prior: {dist: uniform, low: -1.0, high: 1.0}
    vars: [y]
    expr: "100*y"
  y:
    free: True
    prior: {dist: uniform, low: -1.0, high: 1.0}


