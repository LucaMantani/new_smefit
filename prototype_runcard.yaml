# Coefficients to fit
coefficients:
  OtG:
    free: False
    vars: [y, OpWB]
    expr: "y**2 + 0.5*OpWB**2"
  OpWB:
    free: True
    prior: {dist: uniform, low: -0.5, high: 0.5}
  OpD:
    free: True
    prior: {dist: uniform, low: -0.5, high: 0.5}
  OpBox:
    free: False
    # prior: {dist: uniform, low: -1.0, high: 1.0}
    vars: [y]
    expr: "100*y"
  y:
    free: True
    prior: {dist: gaussian, mean: 0.0, std: 1.0}


