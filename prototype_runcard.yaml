# path to data and theory
data_path: ./commondata
theory_path: ./theory
# Covmat settings
use_theory_covmat: True
use_t0: True
# SMEFT Expansion Order
use_quad: True

# Nested Sampling settings
ultranest_settings:
  ReactiveNS_settings:
    vectorized: False
    ndraw_max: 500              # Maximum number of points to simultaneously propose.
  Run_settings:
    min_num_live_points: 200    # Minimum number of live points throughout the run.
    min_ess: 50                 # Target number of effective posterior samples.
    frac_remain: 0.01            # Integrate until this fraction of the integral is left in the remainder.
  # SliceSampler_settings:
  #   nsteps: 106                 # number of accepted steps until the sample is considered independent.

blackjax_settings:
  n_live: 500
  repeats: 3
  delete_fraction: 0.5
  log_precision: -2

optimizer_settings:           # top-level node, reusable by any future fit
    optimizer: adam
    # clipnorm: 1.0
    optimizer_hyperparams:
      learning_rate: 0.001
    # scheduler:
    #   name: linear_schedule
    #   params:
    #     init_value: 1.0e-3
    #     end_value:  1.0e-6
    #     transition_begin: 3000
    #     transition_steps: 10000

hessian_settings:
    sm_solution: false
    n_steps: 2000
    tol: 1.0e-8
    n_samples: 10000

# rge:
#   init_scale: 10000.0
#   obs_scale: dynamic  # float or "dynamic"
#   smeft_accuracy: integrate  # options: integrate, leadinglog
#   yukawa: top  # options: top, full or none
#   adm_QCD: false  # if true, the EW couplings are set to zero
