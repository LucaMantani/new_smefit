[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.1.0"]
build-backend = "poetry_dynamic_versioning.backend"


[tool.poetry]
name = "smefit"
version = "0.0.1"
authors = [ "SMEFiT collaboration" ]
description = "A framework for SMEFT analyses"
repository = "https://github.com/LucaMantani/new_smefit"
readme = "README.md"


[tool.poetry.dependencies]
python = ">=3.12"
prompt_toolkit = "*"
h5py = "*"

reportengine = "*"
jax = "*"
ultranest = "*"
optax = "*"
flax = "*"
wilson="^2.4"
webdavclient3 = "*"
blackjax = {git = "https://github.com/handley-lab/blackjax", tag = "v0.1.0-beta"}
tqdm = "*"
anesthetic = "^2.10.2"
ipython = "*"
pytest = "*"
hypothesis = "*"

# Mark Sphinx and its extensions optional:
sphinx = {version="*", optional=true}
sphinxcontrib-bibtex = {version="*", optional=true}
sphinx-rtd-theme = {version="*", optional=true}
tabulate = {version="*", optional=true}
sphinx-copybutton = {version="*", optional=true}


[tool.poetry.extras]
doc = ["sphinxcontrib-bibtex", "sphinx-rtd-theme", "sphinx", "tabulate", "sphinx-copybutton"]

[tool.poetry.scripts]
smefit = "smefit.app:main"
smefit_ls = "smefit.scripts.server_scripts.smefit_ls:main"
smefit_mv = "smefit.scripts.server_scripts.smefit_mv:main"
smefit_rm = "smefit.scripts.server_scripts.smefit_rm:main"
smefit_restore = "smefit.scripts.server_scripts.smefit_restore:main"
smefit_upload = "smefit.scripts.server_scripts.smefit_upload:main"
smefit_get = "smefit.scripts.server_scripts.smefit_get:main"
view_report = "smefit.scripts.server_scripts.view_report:main"
smefit_setup_server = "smefit.scripts.server_scripts.smefit_setup_server:main"
smefit_sync_registry = "smefit.scripts.server_scripts.smefit_sync_registry:main"
smefit_mkdir = "smefit.scripts.server_scripts.smefit_mkdir:main"
smefit_manage_project = "smefit.scripts.server_scripts.smefit_manage_project:main"
smefit_server = "smefit.scripts.server_scripts.smefit_server:main"
smefit_setup_paths = "smefit.scripts.smefit_setup_paths:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests that call real external samplers or RGE evolution"]
filterwarnings = [
    "ignore::DeprecationWarning:importlib",
]
