# ESPPU linear test runcard
# Datasets: LEP precision measurements
# Expansion: linear EFT (no quadratic terms)
# Coefficient format: natural expressions
#   Each physical coefficient Op is constrained as: Op = bound * Op_nat
#   where Op_nat is a dimensionless natural variable with uniform prior on [-1, 1]

data_path: ./commondata
theory_path: ./theory

use_theory_covmat: False
use_t0: False
use_quad: False

datasets:
  - {name: LEP1_EWPOs_2006, order: LO}
  - {name: LEP_Bhabha_2013, order: LO}
  - {name: LEP_Brw_2013, order: LO}
  - {name: LEP_eeWW_182GeV, order: LO}
  - {name: LEP_eeWW_189GeV, order: LO}
  - {name: LEP_eeWW_198GeV, order: LO}
  - {name: LEP_eeWW_206GeV, order: LO}

# Coefficients in natural expressions format:
# Each physical operator Op is constrained via: Op = bound * Op_nat
# where Op_nat is a dimensionless natural variable with uniform prior on [-1, 1].
# This parametrisation makes the sampling geometry uniform in the natural variables
# while encoding the physical bounds through the expression.
coefficients:
  O3pQ3:
    free: False
    vars: [O3pQ3_nat]
    expr: "12.942664406462672 * O3pQ3_nat"
  O3pQ3_nat:
    free: True
    prior: {dist: uniform, low: -1.0, high: 1.0}

  O3pl1:
