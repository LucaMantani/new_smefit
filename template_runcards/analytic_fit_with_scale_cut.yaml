# Analytic fit with an energy-scale cut on the data points.
#
# max_scale (GeV) drops every data point whose scale -- the `scales` entry of its
# theory file, here the m_tt bin -- is above the cut, from the commondata and the
# theory alike. A point exactly at the cut is kept. The number of points kept per
# dataset is logged at the start of the run.

# path to data and theory: prefixes are resolved via the machine-specific
# .config/paths.yaml -- run smefit_setup_local once to configure (absolute paths also work)
data_path: smefit_database/commondata
theory_path: smefit_database/theory  # required by max_scale: the scales live in the theory files
# Covmat settings
use_theory_covmat: True
use_t0: True
use_quad: False  # the analytic fit needs a linear EFT model

# Global cut, applied to every dataset that does not set its own
max_scale: 1000.0

# Datasets to include
datasets:
  # global cut: keeps the m_tt bins up to 1000 GeV (5 of 7)
  - {name: ATLAS_tt_13TeV_ljets_2016_Mtt, order: NLO_QCD}
  # own cut, overriding the global one: keeps the bins up to 1500 GeV (11 of 15)
  - {name: CMS_tt_13TeV_Mtt, order: NLO_QCD, max_scale: 1500.0}
  # null exempts the dataset from any cut: all 7 bins kept
  - {name: CMS_tt_13TeV_dilep_2016_Mtt, order: NLO_QCD, max_scale: null}

# Coefficients to fit
coefficients:
  OtG:
    free: True
    prior: {dist: uniform, low: -1.0, high: 1.0}
  O8qt:
    free: True
    prior: {dist: uniform, low: -5.0, high: 5.0}

actions_:
- run_analytic_fit
