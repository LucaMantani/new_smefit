# BlackJAX gradient MCMC (No-U-Turn sampler).
#
# Same action as blackjax_fit.yaml — the algorithm is chosen in
# blackjax_settings. Unlike nested sampling, NUTS produces no log evidence
# (fit_results.json has "logz": null), so use nested sampling if you need logz
# for model comparison. `bayesian_update` works with either algorithm.
#
# path to data and theory: prefixes are resolved via the machine-specific
# .config/paths.yaml — run smefit_setup_local once to configure (absolute paths also work)
data_path: smefit_database/commondata
theory_path: smefit_database/theory
# Covmat settings
use_theory_covmat: True
use_t0: True
# SMEFT Expansion Order
use_quad: True

blackjax_settings:
  algorithm: nuts
  num_chains: 4              # chains run in parallel with jax.vmap
  num_warmup: 1000           # step-size + mass-matrix adaptation, discarded
  num_samples: 2500          # post-warmup draws PER CHAIN
  target_acceptance_rate: 0.8  # raise towards 0.95 if divergences appear
  seed: 0

# Total posterior draws kept: num_chains * num_samples are produced and thinned
# down to n_samples. The defaults above already multiply to 10000.
n_samples: 10000

# NUTS is much happier on a decorrelated, unit-scale posterior, so whitening is
# enabled here by default. Uniform priors are sampled through a logit bijector,
# so the prior bounds never stall the sampler.
whitening:
  sigma_prior: 10.0
  eps: 1e-8
  shift: baseline  # baseline or gradient_descent

rge:
  init_scale: 10000.0
  obs_scale: 91.0  # float or "dynamic"
  smeft_accuracy: integrate  # options: integrate, leadinglog
  yukawa: top  # options: top, full or none
  adm_QCD: false  # if true, the EW couplings are set to zero

# # Datasets to include
datasets:
  - {name: LEP1_EWPOs_2006, order: LO}
    # ATLAS_CMS
  - {name: ATLAS_CMS_SSinc_RunI, order: NLO_QCD}

# Coefficients to fit
coefficients:
  OtG:
    free: False
    vars: [y, OpWB]
    expr: "y**2 + 0.5*OpWB**2"
  OpWB:
    free: True
    prior: {dist: uniform, low: -0.5, high: 0.5}
  OpD:
    free: True
    prior: {dist: uniform, low: -0.5, high: 0.5}
  OpBox:
    free: False
    # prior: {dist: uniform, low: -1.0, high: 1.0}
    vars: [y]
    expr: "100*y"
  y:
    free: True
    prior: {dist: gaussian, mean: 0.0, std: 1.0}


external_chi2:
  CMS_DYMee_13TeV:
      path: new_smefit/external_chi2/drell_yan/CMS_DYMee_13TeV.py
      use_quad: True
      order: NLO_QCD
      # save_rge_path: "./CMS_DYMee_rge_matrix"
      # rg_matrix: ./CMS_DYMee_rge_matrix/rge_matrix.pkl
      use_projection_L0: False

# After the fit, check <output>/blackjax_logs/nuts_diagnostics.json:
#   max_rhat should be < 1.01 and divergences should be 0.

actions_:
- run_blackjax_fit
