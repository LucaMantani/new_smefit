# 1D confidence bounds of each fit along the principal components of its own
# Fisher matrix, as a plot and as a table, the posterior correlations of those
# components, and the share of each component's Fisher information coming from
# each dataset: no fit is run here, the posterior samples are read back from
# fit_results.json and rotated into the PCA basis.
#
# Run analytical_fit.yaml and ultranest_fit.yaml first, from this directory.
fits:
  - {name: analytical_fit, path: '.'}
  - {name: ultranest_fit, path: '.', label: '$\mathrm{UltraNest}$'}

# the PCA of each fit, at its best-fit point (every sub-key has a default)
pca_settings: {}

# confidence levels quoted, in percent (default: 68 and 95): one bar width each
# in the plot, one column each in the table
bounds_levels: [68, 95]
# credible intervals quoted: eti (default) and/or hdi. One figure per type,
# saved with the type as its suffix, and one table column per type
interval_types: [eti, hdi]

# restrict the rows to these components, in this order, top to bottom. The key
# is the one the coefficient reports read, so a list serving both bases names
# both: [OpD, PC2, PC1]
# params_to_plot: [PC2, PC1]

# `fits::fitcontext` gives every fit its own setup, hence its own PCA, and
# `pcabasis` below it rotates the fit by that PCA: the routines are those of
# coefficient_bounds_plot.yaml, coefficient_bounds_table.yaml and
# posterior_correlations.yaml, reading the rotated fit. PC1 is a different
# direction in each fit, so there is no comparison across fits.
#
# The PCA diagonalises the Fisher matrix at the best fit, so the components are
# uncorrelated only as far as the likelihood is Gaussian there: correlations
# between them in the posterior signal quadratic EFT terms, or prior edges,
# that the PCA does not see.
#
# The Fisher table and heatmap are rotated too: each row says which datasets
# fix that component (e.g. "PC1 is 80% LEP, 20% LHC"). The per-dataset Fisher
# matrices add up to a diagonal one in this basis, so the global information
# table would be identical to the Fisher one, and is not shown. A flat
# component's shares divide by ~0: they are logged with a warning.
template_text: |
    PCA posterior
    =============
    {@with fits::fitcontext@}
    {@fit@}
    ---------
    {@with pcabasis@}
    PCA bounds
    {@plot_coefficient_bounds@}
    {@coefficient_bounds_table@}
    PCA correlations
    {@plot_posterior_correlations@}
    PCA Fisher information
    {@fisher_diagonals_normalised@}
    {@plot_fisher_diagonals_heatmap@}
    {@endwith@}
    {@endwith@}

actions_:
  - report(main=True)
