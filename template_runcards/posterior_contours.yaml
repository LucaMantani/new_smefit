# Pairwise 2D posterior contours of fits that have already been run: no fit is
# run here, the posterior samples are read back from each fit's
# fit_results.json. The panels are the lower triangle of the coefficient matrix.
# `contours` sets how each fit is drawn: kernel density contours (kde, the
# default) or Gaussian ellipses from the samples' covariance (gaussian), only
# faithful for a Gaussian posterior.
fits:
  - {name: analytical_fit, path: '.', label: '$\mathrm{Analytic}$', contours: gaussian}
  - {name: ultranest_fit, path: '.', label: '$\mathrm{UltraNest}$', contours: kde}

# confidence levels drawn, in percent (default: 68 and 95). Each region holds
# that fraction of the joint 2D posterior, so its projection onto an axis is
# wider than the 1D interval at the same level in the bounds tables and plots,
# although they read the same key. The widest region is filled, every narrower
# one an outline in its own line style, named in the legend
bounds_levels: [68, 95]

# restrict the panels to these coefficients, in this order (at least two)
# params_to_plot: [OpD, OpWB]

# hatch the filled regions, one pattern per fit, so they read in greyscale
# (default: true)
# hatch: false

# The comparison overlays every fit in one figure, one colour and hatch each; a
# fit is left out of the panels of a coefficient it did not sample.
# `with fits` opens a section per fit, each with its own figure.
template_text: |
    Posterior contours comparison
    =============================
    {@plot_posterior_contours_comparison@}

    Posterior contours per fit
    ==========================
    {@with fits@}
    {@fit@}
    ---------
    {@plot_posterior_contours@}
    {@endwith@}

actions_:
  - report(main=True)
