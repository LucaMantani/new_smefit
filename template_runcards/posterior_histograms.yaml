# Marginal posteriors of the free and expr-constrained coefficients of fits that
# have already been run: no fit is run here, the posterior samples are read back
# from each fit's fit_results.json. One panel per coefficient.
fits:
  - {name: analytical_fit, path: '.', label: '$\mathrm{Analytic}$'}
  - {name: ultranest_fit, path: '.', label: '$\mathrm{UltraNest}$'}

# `params_to_plot`:
# restrict the panels to these coefficients, in this order.
# params_to_plot: [OtG, OtW, OpQM, OpQ3]

# Presentation: top-level keys, or action arguments, which win —
# {@plot_posterior_histograms(n_bins=50)@}.
#
# histogram bins each fit is drawn with
n_bins: 30
# comparison only — true: every fit on a panel uses the same bins, so their
# bars line up; false: each fit is binned over its own range (better for a
# narrow posterior beside a wide one)
shared_bins: false
# panels per row
n_cols: 4

# The comparison overlays every fit in one figure, a fit's colour each; a
# coefficient a fit did not sample has no histogram from it.
# `with fits` opens a section per fit, each with its own figure.
template_text: |
    Marginal posteriors comparison
    ==============================
    {@plot_posterior_histograms_comparison@}

    Marginal posteriors per fit
    ===========================
    {@with fits@}
    {@fit@}
    ---------
    {@plot_posterior_histograms@}
    {@endwith@}

actions_:
  - report(main=True)
