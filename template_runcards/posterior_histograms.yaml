# Marginal posteriors of the free coefficients of fits that have already been
# run: no fit is run here, the posterior samples are read back from each fit's
# fit_results.json. One figure, one panel per coefficient, every fit listed
# under `fits` overlaid in its own colour (a single fit works too).
fits:
  - {name: analytical_fit, path: '.', label: '$\mathrm{Analytic}$'}
  - {name: ultranest_fit, path: '.', label: '$\mathrm{UltraNest}$'}

# `params_to_plot`:
# restrict the panels to these coefficients, in this order.
# params_to_plot: [OtG, OtW, OpQM, OpQ3]

# Presentation: top-level keys, or action arguments, which win —
# {@plot_posterior_histograms(n_bins=50)@}.
#
# histogram bins each fit is drawn with
n_bins: 30
# true: every fit on a panel uses the same bins, so their bars line up;
# false: each fit is binned over its own range (better for a narrow posterior)
shared_bins: false
# panels per row
n_cols: 4

template_text: |
    Marginal posteriors
    ===================
    {@plot_posterior_histograms@}

actions_:
  - report(main=True)
